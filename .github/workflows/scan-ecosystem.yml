name: Scan Arc Ecosystem

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan for new projects
        run: |
          cat > /tmp/scan.js << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const knownProjects = [
            "synthra_finance", "PulsarMoneyApp", "AIsaOneHQ", "Xylonet_",
            "TowerExchange", "tlay_io", "BlockradarHQ", "myazahq",
            "payritHQ", "ViFi_Labs", "usesfxmoneyapp", "Mimir_Markets",
            "hinkal_protocol", "ArcDEXScan", "MeridianFi", "KONswap",
            "wirexapp", "0xsequence", "arckitties", "arcadiansonarc",
            "8bitarc", "onchainsharc", "cctp420", "sharcbay", "unemployeeonarc"
          ];

          const subPath = path.join(process.cwd(), 'data', 'submitted-projects.json');
          let submitted = [];
          try {
            submitted = JSON.parse(fs.readFileSync(subPath, 'utf-8'));
          } catch {}

          const submittedHandles = new Set(submitted.map(s => s.handle).filter(Boolean));
          const newFound = [];

          // Check for recent ecosystem announcements
          // This runs on X API - for now use a web search fallback
          const endpoints = [
            'https://r.jina.ai/https://x.com/arc',
            'https://r.jina.ai/https://x.com/search?q=arc+ecosystem+project&src=typed_query&f=top',
          ];

          (async () => {
            for (const endpoint of endpoints) {
              try {
                const res = await fetch(endpoint, {
                  headers: { 'Accept': 'text/plain', 'X-Return-Format': 'text' },
                  signal: AbortSignal.timeout(15000),
                });
                const text = await res.text();
                console.log(`Fetched ${endpoint}: ${text.length} chars`);
              } catch (e) {
                console.log(`Failed ${endpoint}: ${e.message}`);
              }
            }

            if (newFound.length > 0) {
              fs.writeFileSync(subPath, JSON.stringify([...submitted, ...newFound], null, 2));
              console.log(`Added ${newFound.length} new projects`);
            } else {
              console.log('No new projects found');
            }
          })();
          SCRIPT

          node /tmp/scan.js 2>&1 || echo "Scan completed (no new projects)"

      - name: Commit and push if changed
        run: |
          git config user.name "Arc Ecosystem Scanner"
          git config user.email "faisalsathu72@gmail.com"
          git add data/submitted-projects.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-scan: update ecosystem projects [skip ci]"
            git push
          fi
